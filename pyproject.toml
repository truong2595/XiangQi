#[ PyProject configuration for XiangQi project ]
[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "xiangqi"
version = "0.1.0"
description = "Offline XiangQi (Chinese Chess) engine with CLI & Pygame UI"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
keywords = ["xiangqi", "chinese-chess", "board-game"]
packages = [{ include = "xiangqi" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pygame = { version = "^2.5.0", optional = true }
typer = { version = "^0.12.0", optional = true }

[tool.poetry.extras]
ui = ["pygame"]
cli = ["typer"]
all = ["pygame", "typer"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
mypy = "^1.10.0"
ruff = "^0.5.0"
pytest-cov = "^5.0.0"

[tool.poetry.scripts]
xiangqi-cli = "xiangqi.cli.cli_main:main"
xiangqi-pygame = "xiangqi.ui.pygame_app:run"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
ignore_missing_imports = true

